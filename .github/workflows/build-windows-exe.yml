name: Build Windows Installer (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install Electron & Electron Builder (Windows)
        run: npm install --no-save --no-audit --no-fund electron@35.1.5 electron-builder@26.0.12

      - name: Build frontend & Express backend
        run: npm run build

      - name: Package Windows NSIS Setup (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.yml

      - name: Upload Windows .exe Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHREIN-DPI-Windows-Installer
          path: dist-electron/CHREIN-DPI-Setup-*.exe
          if-no-files-found: error
